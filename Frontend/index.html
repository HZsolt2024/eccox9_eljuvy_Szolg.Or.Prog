<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vásárlások</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
</head>
<body>
    <main class="app">
        <header class="page-header">
            <div>
                <p class="eyebrow">Nyilvántartás</p>
                <h1>Vásárlások</h1>
            </div>
            <button id="refreshButton" class="button button-secondary" type="button">Lista frissítése</button>
        </header>

        <p id="pageStatus" class="status" role="status" aria-live="polite"></p>

        <section class="panel" aria-labelledby="purchaseListHeading">
            <div class="panel-heading">
                <div>
                    <h2 id="purchaseListHeading">Vásárlási előzmények</h2>
                    <p id="purchaseCount" class="muted">Betöltés…</p>
                </div>
                <label class="sr-only" for="customerFilter">Szűrés vevő neve alapján</label>
                <input id="customerFilter" class="text-input filter-input" type="search" placeholder="Keresés vevőnév alapján…" autocomplete="off">
            </div>

            <div class="table-wrapper">
                <table class="purchase-table">
                    <thead>
                        <tr>
                            <th scope="col">Azonosító</th>
                            <th scope="col">Vevő</th>
                            <th scope="col">Dátum</th>
                            <th scope="col">Tételek</th>
                            <th scope="col">Végösszeg</th>
                        </tr>
                    </thead>
                    <tbody id="purchaseTableBody"></tbody>
                </table>
                <p id="emptyPurchases" class="empty-message" hidden></p>
            </div>
        </section>

        <section class="panel form-panel" aria-labelledby="purchaseFormHeading">
            <h2 id="purchaseFormHeading">Új vásárlás rögzítése</h2>
            <p id="formStatus" class="status" role="status" aria-live="polite"></p>
            <form id="purchaseForm">
                <div class="form-fields">
                    <label>
                        Vevő neve
                        <input id="customerName" class="text-input" name="customerName" type="text" maxlength="200" required>
                    </label>
                    <label>
                        Dátum és idő
                        <input id="purchaseDate" class="text-input" name="date" type="datetime-local" required>
                    </label>
                    <label>
                        Végösszeg (Ft)
                        <input id="totalAmount" class="text-input" name="totalAmount" type="number" min="0" step="1" required>
                    </label>
                </div>
                <label class="items-field">
                    Tételek (soronként egy tétel)
                    <textarea id="purchaseItems" class="text-input" name="items" rows="4" placeholder="Termékek"></textarea>
                </label>
                <div class="form-actions">
                    <button id="savePurchaseButton" class="button" type="submit">Vásárlás rögzítése</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
